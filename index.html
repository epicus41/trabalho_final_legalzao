<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Bacanudo</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-list-check"></i>
                <h1>Gerenciador de Tarefas Bacanudo</h1>
            </div>
            <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Alternar tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Formulário de Nova Tarefa -->
        <section class="task-form-card">
            <form id="taskForm">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="O que você precisa fazer?" autocomplete="off" required>
                    <div class="datetime-wrapper">
                        <i class="fa-regular fa-clock calendar-icon"></i>
                        <input type="datetime-local" id="taskDeadline">
                    </div>
                    <button type="submit" id="addBtn" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i>
                        <span>Adicionar</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Filtros e Ordenação -->
        <section class="controls-card">
            <div class="filter-buttons" role="group" aria-label="Filtros de tarefas">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
            
            <div class="sort-wrapper">
                <label for="sortSelect"><i class="fa-solid fa-sort"></i> Ordenar:</label>
                <select id="sortSelect" class="sort-select">
                    <option value="created">Data de criação</option>
                    <option value="deadline">Data limite (Prazo)</option>
                </select>
            </div>
        </section>

        <!-- Lista de Tarefas -->
        <main class="tasks-container">
            <ul id="taskList" class="task-list"></ul>
            <div id="emptyState" class="empty-state hidden">
                <i class="fa-regular fa-folder-open"></i>
                <p>Nenhuma tarefa encontrada por aqui!</p>
            </div>
        </main>

        <!-- Rodapé com Métricas e Ações em Lote -->
        <footer class="app-footer">
            <div class="counters">
                <span id="counterText">0 restantes de 0 totais</span>
            </div>
            <button id="clearCompletedBtn" class="btn btn-danger-outline hidden">
                <i class="fa-regular fa-trash-can"></i> Limpar concluídas
            </button>
        </footer>

        <!-- Patrocínio -->
        <div class="sponsor-tag">
            Patrocinado por: <strong>Babau do Pandeiro Corporation 🪘</strong>
        </div>
    </div>

    <!-- Container de Toasts/Notificações -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JavaScript Externo -->
    <script src="script.js"></script>
</body>
</html>
